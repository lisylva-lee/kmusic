<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0d0f14;}
  .raw{width:512px;height:512px;display:block;margin:0;}
  .row{display:flex;}
  #sheet{
    display:grid;
    grid-template-columns:repeat(3,360px);
    gap:30px;
    padding:34px;
    background:#E9ECF2;
    width:max-content;
  }
  .round{
    width:360px;height:360px;border-radius:50%;overflow:hidden;
    box-shadow:0 10px 26px rgba(20,26,45,.28);
  }
  .round svg{width:360px;height:360px;display:block;}
</style>
</head>
<body>

<!-- ============ 共享定义 ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>

  <!-- 抛光铬：亮→中→暗→亮 的带状渐变，是金属感的核心 -->
  <linearGradient id="g_chrome" x1="16%" y1="4%" x2="84%" y2="98%">
    <stop offset="0%"   stop-color="#FFFFFF"/>
    <stop offset="14%"  stop-color="#D5DDF2"/>
    <stop offset="30%"  stop-color="#78829F"/>
    <stop offset="44%"  stop-color="#EFF3FF"/>
    <stop offset="58%"  stop-color="#9AA5C4"/>
    <stop offset="74%"  stop-color="#3B4260"/>
    <stop offset="88%"  stop-color="#B9C4E0"/>
    <stop offset="100%" stop-color="#5C6690"/>
  </linearGradient>

  <linearGradient id="g_chrome_v" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#F4F7FF"/>
    <stop offset="26%"  stop-color="#9FAAC9"/>
    <stop offset="50%"  stop-color="#4A5273"/>
    <stop offset="72%"  stop-color="#DCE4F8"/>
    <stop offset="100%" stop-color="#69739A"/>
  </linearGradient>

  <radialGradient id="g_bg_indigo" cx="50%" cy="36%" r="82%">
    <stop offset="0%"   stop-color="#3B3F8C"/>
    <stop offset="52%"  stop-color="#171A38"/>
    <stop offset="100%" stop-color="#090B12"/>
  </radialGradient>

  <radialGradient id="g_bg_violet" cx="46%" cy="30%" r="86%">
    <stop offset="0%"   stop-color="#4A3277"/>
    <stop offset="50%"  stop-color="#1B1733"/>
    <stop offset="100%" stop-color="#0A0810"/>
  </radialGradient>

  <radialGradient id="g_bg_ink" cx="50%" cy="40%" r="80%">
    <stop offset="0%"   stop-color="#1E2A52"/>
    <stop offset="55%"  stop-color="#101529"/>
    <stop offset="100%" stop-color="#07080D"/>
  </radialGradient>

  <radialGradient id="g_vinyl" cx="42%" cy="34%" r="72%">
    <stop offset="0%"   stop-color="#3A3F55"/>
    <stop offset="46%"  stop-color="#191C29"/>
    <stop offset="100%" stop-color="#0C0D14"/>
  </radialGradient>

  <!-- 唱片斜向反光带 -->
  <linearGradient id="g_sheen" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="33%"  stop-color="#FFFFFF" stop-opacity="0.42"/>
    <stop offset="46%"  stop-color="#FFFFFF" stop-opacity="0.06"/>
    <stop offset="62%"  stop-color="#FFFFFF" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="g_label" x1="20%" y1="10%" x2="80%" y2="92%">
    <stop offset="0%"   stop-color="#8E8BFF"/>
    <stop offset="55%"  stop-color="#5B58E0"/>
    <stop offset="100%" stop-color="#3A2E9E"/>
  </linearGradient>

  <!-- 霓虹辉光 -->
  <filter id="f_glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="3.4" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
    <feMerge>
      <feMergeNode in="b2"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- 真镜面光照：从模糊后的 alpha 推出法线，打出边缘高光 = 立体感 -->
  <filter id="f_metal" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4.6" result="bump"/>
    <feSpecularLighting in="bump" surfaceScale="7" specularConstant="1.15"
                        specularExponent="22" lighting-color="#ffffff" result="spec">
      <fePointLight x="22" y="8" z="150"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
    <feMerge>
      <feMergeNode in="SourceGraphic"/>
      <feMergeNode in="specClip"/>
    </feMerge>
  </filter>

</defs>

<!-- ============ 1. 墨滴 + 声波环 ============ -->
<symbol id="ic1" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="url(#g_bg_indigo)"/>
  <g fill="none" stroke-linecap="round" filter="url(#f_glow)">
    <circle cx="54" cy="60" r="31" stroke="#6E6BF0" stroke-width="1.8" opacity="0.92"/>
    <circle cx="54" cy="60" r="40" stroke="#4FD8FF" stroke-width="1.3" opacity="0.55"/>
    <circle cx="54" cy="60" r="48" stroke="#6E6BF0" stroke-width="0.9" opacity="0.26"/>
  </g>
  <path d="M54 24 C64 42 76 52 76 62 A22 22 0 1 1 32 62 C32 52 44 42 54 24 Z"
        fill="url(#g_chrome)" filter="url(#f_metal)"/>
  <path d="M54 27 C62 42 70 49 72.5 58" fill="none" stroke="#FFFFFF"
        stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <ellipse cx="45" cy="60" rx="5.6" ry="8.6" fill="#FFFFFF" opacity="0.34"
           transform="rotate(-24 45 60)"/>
</symbol>

<!-- ============ 2. 铬合金音符 ============ -->
<symbol id="ic2" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="url(#g_bg_violet)"/>
  <ellipse cx="54" cy="54" rx="31" ry="31" fill="#6E6BF0" opacity="0.32" filter="url(#f_glow)"/>
  <circle cx="54" cy="54" r="32" fill="none" stroke="#7B78FF" stroke-width="2.2"
          opacity="0.95" filter="url(#f_glow)"/>
  <circle cx="54" cy="54" r="42" fill="none" stroke="#A98BFF" stroke-width="1.2"
          opacity="0.5" filter="url(#f_glow)"/>
  <g filter="url(#f_metal)">
    <rect x="45" y="30" width="3.6" height="43" fill="url(#g_chrome)"/>
    <rect x="76.8" y="24" width="3.6" height="43" fill="url(#g_chrome)"/>
    <path d="M45 30 L80.4 24 L80.4 37.5 L45 43.5 Z" fill="url(#g_chrome_v)"/>
    <ellipse cx="37" cy="73" rx="11.4" ry="8.6" fill="url(#g_chrome)"
             transform="rotate(-18 37 73)"/>
    <ellipse cx="68.8" cy="67" rx="11.4" ry="8.6" fill="url(#g_chrome)"
             transform="rotate(-18 68.8 67)"/>
  </g>
  <path d="M51.5 32 L51.5 70" stroke="#FFFFFF" stroke-width="0.9" opacity="0.55"/>
  <path d="M47 33 L78 27.5" stroke="#FFFFFF" stroke-width="1.1" opacity="0.5"/>
</symbol>

<!-- ============ 3. 「墨」字金属浮雕 ============ -->
<symbol id="ic3" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="url(#g_bg_ink)"/>
  <ellipse cx="54" cy="56" rx="29" ry="29" fill="#6E6BF0" opacity="0.34" filter="url(#f_glow)"/>
  <g font-family="'MiSans VF','Alibaba PuHuiTi B','Noto Sans CJK SC',sans-serif" font-weight="900"
     font-size="46" text-anchor="middle">
    <text x="56.4" y="71.4" fill="#141a35">音</text>
    <text x="54" y="69" fill="url(#g_chrome)" stroke="#07090F" stroke-width="1"
          paint-order="stroke">音</text>
  </g>
  <path d="M24 88 Q39 81 54 88 T84 88" fill="none" stroke="#6E6BF0"
        stroke-width="2.6" stroke-linecap="round" filter="url(#f_glow)"/>
</symbol>

<!-- ============ 4. 黑胶唱片 + 霓虹弧 ============ -->
<symbol id="ic4" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="url(#g_bg_indigo)"/>
  <circle cx="54" cy="54" r="33" fill="url(#g_vinyl)"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.075" stroke-width="0.5">
    <circle cx="54" cy="54" r="13"/><circle cx="54" cy="54" r="15"/>
    <circle cx="54" cy="54" r="17"/><circle cx="54" cy="54" r="19"/>
    <circle cx="54" cy="54" r="21"/><circle cx="54" cy="54" r="23"/>
    <circle cx="54" cy="54" r="25"/><circle cx="54" cy="54" r="27"/>
    <circle cx="54" cy="54" r="29"/><circle cx="54" cy="54" r="31"/>
  </g>
  <circle cx="54" cy="54" r="33" fill="url(#g_sheen)"/>
  <!-- 抛光金属外圈：唱片本体太黑，靠这圈把「金属」拉回来 -->
  <circle cx="54" cy="54" r="33" fill="none" stroke="url(#g_chrome)"
          stroke-width="3.6" filter="url(#f_metal)"/>
  <path d="M54 21.4 A32.6 32.6 0 0 1 86.6 54" fill="none" stroke="#6E6BF0"
        stroke-width="2.4" stroke-linecap="round" filter="url(#f_glow)"/>
  <path d="M21.4 54 A32.6 32.6 0 0 1 38 26.8" fill="none" stroke="#4FD8FF"
        stroke-width="1.6" stroke-linecap="round" opacity="0.8" filter="url(#f_glow)"/>
  <circle cx="54" cy="54" r="10.6" fill="url(#g_label)" filter="url(#f_glow)"/>
  <circle cx="54" cy="54" r="10.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8"/>
  <circle cx="54" cy="54" r="2.1" fill="#0B0E14"/>
</symbol>

<!-- ============ 5. 金属声波柱 ============ -->
<symbol id="ic5" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="url(#g_bg_violet)"/>
  <g fill="#6E6BF0" opacity="0.55" filter="url(#f_glow)">
    <rect x="23" y="43" width="7" height="22" rx="3.5"/>
    <rect x="35" y="37" width="7" height="34" rx="3.5"/>
    <rect x="47" y="29" width="7" height="50" rx="3.5"/>
    <rect x="59" y="35" width="7" height="38" rx="3.5"/>
    <rect x="71" y="41" width="7" height="26" rx="3.5"/>
  </g>
  <g fill="url(#g_chrome_v)" filter="url(#f_metal)">
    <rect x="26.5" y="45" width="7" height="18" rx="3.5"/>
    <rect x="38.5" y="39" width="7" height="30" rx="3.5"/>
    <rect x="50.5" y="31" width="7" height="46" rx="3.5"/>
    <rect x="62.5" y="37" width="7" height="34" rx="3.5"/>
    <rect x="74.5" y="43" width="7" height="22" rx="3.5"/>
  </g>
</symbol>

</svg>

<!-- ============ 原图（512，全出血） ============ -->
<div class="row" id="raws">
  <svg class="raw" viewBox="0 0 108 108"><use href="#ic1"/></svg>
  <svg class="raw" viewBox="0 0 108 108"><use href="#ic2"/></svg>
</div>
<div class="row">
  <svg class="raw" viewBox="0 0 108 108"><use href="#ic3"/></svg>
  <svg class="raw" viewBox="0 0 108 108"><use href="#ic4"/></svg>
</div>
<div class="row">
  <svg class="raw" viewBox="0 0 108 108"><use href="#ic5"/></svg>
</div>

<!-- ============ 圆形遮罩预览（模拟桌面图标） ============ -->
<div id="sheet">
  <div class="round"><svg viewBox="0 0 108 108"><use href="#ic1"/></svg></div>
  <div class="round"><svg viewBox="0 0 108 108"><use href="#ic2"/></svg></div>
  <div class="round"><svg viewBox="0 0 108 108"><use href="#ic3"/></svg></div>
  <div class="round"><svg viewBox="0 0 108 108"><use href="#ic4"/></svg></div>
  <div class="round"><svg viewBox="0 0 108 108"><use href="#ic5"/></svg></div>
</div>

</body>
</html>
